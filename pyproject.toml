[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burnsev"
version = "0.1.0"
description = "Sentinel-2 burn severity (dNBR) pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyproj>=3.4",
    "shapely>=2.0",
    "geopandas>=0.14",
    "rasterio>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
